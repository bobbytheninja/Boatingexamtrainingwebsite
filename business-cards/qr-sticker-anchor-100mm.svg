<!-- QR Code Sticker: Anchor Shape (100mm × 120mm) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 377.95 453.54" width="377.95" height="453.54">
  <!-- 100mm × 120mm at 3.7795px/mm -->
  <defs>
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White background circle -->
  <circle cx="189" cy="227" r="180" fill="#ffffff"/>

  <!-- Anchor shape (stylized) -->
  <g filter="url(#shadow)">
    <!-- Ring at top -->
    <circle cx="189" cy="80" r="20" fill="none" stroke="url(#anchorGrad)" stroke-width="12"/>

    <!-- Vertical shaft -->
    <rect x="181" y="100" width="16" height="180" fill="url(#anchorGrad)" rx="3"/>

    <!-- Cross bar -->
    <rect x="130" y="200" width="118" height="14" fill="url(#anchorGrad)" rx="7"/>

    <!-- Bottom flukes (left) -->
    <path d="M189 280 L130 280 Q110 280 110 300 L110 330 Q110 345 120 345 L135 345"
          fill="none"
          stroke="url(#anchorGrad)"
          stroke-width="14"
          stroke-linecap="round"/>

    <!-- Fluke decoration left -->
    <circle cx="125" cy="337" r="15" fill="url(#anchorGrad)"/>

    <!-- Bottom flukes (right) -->
    <path d="M189 280 L248 280 Q268 280 268 300 L268 330 Q268 345 258 345 L243 345"
          fill="none"
          stroke="url(#anchorGrad)"
          stroke-width="14"
          stroke-linecap="round"/>

    <!-- Fluke decoration right -->
    <circle cx="253" cy="337" r="15" fill="url(#anchorGrad)"/>
  </g>

  <!-- QR Code area (center of anchor) -->
  <rect x="129" y="120" width="120" height="120" fill="#ffffff" stroke="#0ea5e9" stroke-width="3" rx="8"/>
  <text x="189" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">
    QR CODE
  </text>
  <text x="189" y="195" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">
    (Insert actual QR)
  </text>

  <!-- Text at bottom -->
  <text x="189" y="390" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0369a1" text-anchor="middle">
    BLACK SEA BULGARIA
  </text>
  <text x="189" y="415" font-family="Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">
    Scan for Yacht Exam Training
  </text>
  <text x="189" y="435" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    blackseabulgaria.com
  </text>

  <!-- Decorative wave at very bottom -->
  <path d="M50 445 Q120 438 189 445 T328 445"
        stroke="#0ea5e9"
        stroke-width="4"
        fill="none"
        opacity="0.5"
        stroke-linecap="round"/>
</svg>

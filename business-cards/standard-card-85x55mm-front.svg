<!-- Standard Business Card: 85mm × 55mm (Front) -->
<!-- Print specs: 85mm × 55mm + 2mm bleed = 89mm × 59mm -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336.38 223" width="336.38" height="223">
  <!-- Conversion: 89mm × 59mm at 3.7795px/mm -->
  <defs>
    <linearGradient id="stdBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="336.38" height="223" fill="url(#stdBgGrad)"/>

  <!-- Decorative wave layers (bottom) -->
  <path d="M0 165 Q84 155 168 165 T336.38 165 L336.38 180 Q252 190 168 180 T0 180 Z"
        fill="#ffffff"
        opacity="0.08"/>
  <path d="M0 180 Q84 173 168 180 T336.38 180 L336.38 195 Q252 203 168 195 T0 195 Z"
        fill="#ffffff"
        opacity="0.12"/>
  <path d="M0 195 Q84 188 168 195 T336.38 195 L336.38 223 L0 223 Z"
        fill="#ffffff"
        opacity="0.15"/>

  <!-- Yacht icon (larger, top left) -->
  <g transform="translate(25, 30)">
    <!-- Hull -->
    <path d="M15 55 L40 65 L65 55 L60 62 L20 62 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Main sail -->
    <path d="M40 15 L40 55 L75 47 Z" fill="#ffffff" opacity="0.92"/>
    <!-- Front sail -->
    <path d="M40 20 L40 55 L15 43 Z" fill="#f0f9ff" opacity="0.88"/>
    <!-- Mast -->
    <rect x="37" y="10" width="6" height="45" fill="#ffffff"/>
    <!-- Flag -->
    <path d="M40 10 L58 15 L40 20 Z" fill="#ef4444"/>
    <!-- Wave detail -->
    <path d="M5 68 Q25 63 45 68 T85 68" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Company name (center, larger) -->
  <text x="168" y="105" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    BLACK SEA BULGARIA
  </text>

  <!-- Tagline (below company name) -->
  <text x="168" y="130" font-family="Arial, sans-serif" font-size="12" fill="#f0f9ff" text-anchor="middle" letter-spacing="2">
    YACHT &amp; BOAT EXAM TRAINING
  </text>

  <!-- Website (bottom right) -->
  <text x="310" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="end">
    blackseabulgaria.com
  </text>

  <!-- Small icons bottom left -->
  <text x="25" y="205" font-family="Arial, sans-serif" font-size="9" fill="#f0f9ff">
    ⚓ Professional Training Since 2024
  </text>
</svg>

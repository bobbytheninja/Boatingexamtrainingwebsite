<!-- QR Code Sticker: Yacht/Boat Shape (120mm × 100mm) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 453.54 377.95" width="453.54" height="377.95">
  <!-- 120mm × 100mm at 3.7795px/mm -->
  <defs>
    <linearGradient id="boatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>

    <filter id="boatShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="453.54" height="377.95" fill="#ffffff" rx="25"/>

  <!-- Stylized boat/yacht silhouette (top section) -->
  <g filter="url(#boatShadow)" transform="translate(227, 80)">
    <!-- Boat hull (bottom of boat) -->
    <path d="M-100 60 L-80 80 L80 80 L100 60 L90 90 L-90 90 Z"
          fill="url(#boatGrad)"
          opacity="0.9"/>

    <!-- Main sail (right) -->
    <path d="M0 -40 L0 60 L80 40 Z"
          fill="url(#boatGrad)"
          opacity="0.85"/>

    <!-- Front sail (left) -->
    <path d="M0 -30 L0 60 L-70 35 Z"
          fill="#0ea5e9"
          opacity="0.7"/>

    <!-- Mast -->
    <rect x="-5" y="-45" width="10" height="105" fill="url(#boatGrad)"/>

    <!-- Flag -->
    <path d="M0 -45 L30 -37 L0 -29 Z" fill="#ef4444"/>

    <!-- Waves under boat -->
    <path d="M-110 95 Q-55 88 0 95 T110 95"
          stroke="url(#boatGrad)"
          stroke-width="6"
          fill="none"
          opacity="0.4"
          stroke-linecap="round"/>
  </g>

  <!-- QR Code area (center) -->
  <rect x="167" y="185" width="120" height="120" fill="#ffffff" stroke="#0ea5e9" stroke-width="4" rx="10"/>
  <text x="227" y="238" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0369a1" text-anchor="middle">
    QR CODE
  </text>
  <text x="227" y="260" font-family="Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">
    (Replace with actual)
  </text>

  <!-- Company info (bottom) -->
  <text x="227" y="335" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0369a1" text-anchor="middle">
    BLACK SEA BULGARIA
  </text>
  <text x="227" y="358" font-family="Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="middle">
    Scan to Start Your Yacht Exam Training
  </text>

  <!-- Border decoration -->
  <rect x="5" y="5" width="443.54" height="367.95" fill="none" stroke="#0ea5e9" stroke-width="2" rx="22" opacity="0.3"/>
</svg>

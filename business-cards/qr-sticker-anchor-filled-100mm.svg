<!-- QR Code Sticker: Anchor Shape with Large QR Fill (100mm × 120mm) -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 377.95 453.54" width="377.95" height="453.54">
  <!-- 100mm × 120mm at 3.7795px/mm -->
  <defs>
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for anchor shape to contain QR code -->
    <clipPath id="anchorClip">
      <path d="M189 60
               A 20 20 0 1 1 189 60
               M189 100
               L189 280
               M130 200
               L248 200
               M189 280
               L130 280 Q110 280 110 300 L110 330 Q110 345 125 345
               M189 280
               L248 280 Q268 280 268 300 L268 330 Q268 345 253 345"
            stroke-width="40"/>
    </clipPath>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="377.95" height="453.54" fill="#f0f9ff"/>

  <!-- Large QR Code fills most of the sticker -->
  <g transform="translate(89, 60)">
    <!-- White background for QR code -->
    <rect x="-10" y="-10" width="220" height="220" fill="#ffffff" rx="10"/>

    <!-- QR CODE IMAGE - Replace this with actual image reference -->
    <!-- For Illustrator/Inkscape: Delete this and place your image.png here -->
    <image xlink:href="../src/imports/image.png" x="0" y="0" width="200" height="200"/>
  </g>

  <!-- Anchor outline overlays the QR code -->
  <g filter="url(#shadow)">
    <!-- Ring at top -->
    <circle cx="189" cy="80" r="20" fill="none" stroke="url(#anchorGrad)" stroke-width="10"/>

    <!-- Vertical shaft (semi-transparent to show QR through it) -->
    <rect x="181" y="100" width="16" height="180" fill="url(#anchorGrad)" opacity="0.85" rx="3"/>

    <!-- Cross bar (semi-transparent) -->
    <rect x="130" y="200" width="118" height="14" fill="url(#anchorGrad)" opacity="0.85" rx="7"/>

    <!-- Bottom flukes (left) - solid -->
    <path d="M189 280 L130 280 Q110 280 110 300 L110 330 Q110 345 120 345 L135 345"
          fill="none"
          stroke="url(#anchorGrad)"
          stroke-width="14"
          stroke-linecap="round"/>
    <circle cx="125" cy="337" r="15" fill="url(#anchorGrad)"/>

    <!-- Bottom flukes (right) - solid -->
    <path d="M189 280 L248 280 Q268 280 268 300 L268 330 Q268 345 258 345 L243 345"
          fill="none"
          stroke="url(#anchorGrad)"
          stroke-width="14"
          stroke-linecap="round"/>
    <circle cx="253" cy="337" r="15" fill="url(#anchorGrad)"/>
  </g>

  <!-- Text at bottom -->
  <text x="189" y="385" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0369a1" text-anchor="middle">
    BLACK SEA BULGARIA
  </text>
  <text x="189" y="410" font-family="Arial, sans-serif" font-size="13" fill="#0284c7" text-anchor="middle">
    Scan for Yacht Exam Training
  </text>
  <text x="189" y="432" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    blackseabulgaria.com
  </text>

  <!-- Decorative wave at very bottom -->
  <path d="M50 445 Q120 438 189 445 T328 445"
        stroke="#0ea5e9"
        stroke-width="4"
        fill="none"
        opacity="0.5"
        stroke-linecap="round"/>
</svg>

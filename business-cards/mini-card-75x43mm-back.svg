<!-- Mini Business Card: 75.28mm × 43mm (Back) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 299.53 177.17" width="299.53" height="177.17">
  <defs>
    <linearGradient id="bgBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="299.53" height="177.17" fill="url(#bgBack)"/>

  <!-- Decorative wave accent (top) -->
  <path d="M0 0 Q75 15 150 0 T300 0 L300 25 Q225 35 150 25 T0 25 Z"
        fill="#0ea5e9"
        opacity="0.08"/>

  <!-- QR Code placeholder (left side) -->
  <rect x="25" y="45" width="85" height="85" fill="#1e293b" rx="8"/>
  <text x="67.5" y="92" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">
    QR CODE
  </text>
  <text x="67.5" y="105" font-family="Arial, sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle">
    (Replace with actual)
  </text>

  <!-- Contact info (right side) -->
  <g transform="translate(130, 55)">
    <!-- Phone -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">
      📞 +359 XXX XXX XXX
    </text>

    <!-- Email -->
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">
      ✉️ info@blackseabulgaria.com
    </text>

    <!-- Address -->
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="9" fill="#475569">
      📍 Bulgaria, Black Sea Coast
    </text>

    <!-- Website -->
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0ea5e9">
      🌐 blackseabulgaria.com
    </text>
  </g>

  <!-- Bottom tagline -->
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-style="italic">
    Professional Maritime Exam Preparation
  </text>
</svg>

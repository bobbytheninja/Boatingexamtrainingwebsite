<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgHelm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0369a1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075985;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bgHelm)"/>

  <!-- Ship's wheel (helm) -->
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Inner hub -->
  <circle cx="64" cy="64" r="12" fill="#ffffff"/>

  <!-- 8 spokes -->
  <line x1="64" y1="28" x2="64" y2="52" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="89.46" y1="38.54" x2="73.46" y2="54.54" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="64" x2="76" y2="64" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="89.46" y1="89.46" x2="73.46" y2="73.46" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="100" x2="64" y2="76" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="38.54" y1="89.46" x2="54.54" y2="73.46" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="64" x2="52" y2="64" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="38.54" y1="38.54" x2="54.54" y2="54.54" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Handle grips on outer ring -->
  <circle cx="64" cy="28" r="5" fill="#0ea5e9"/>
  <circle cx="100" cy="64" r="5" fill="#0ea5e9"/>
  <circle cx="64" cy="100" r="5" fill="#0ea5e9"/>
  <circle cx="28" cy="64" r="5" fill="#0ea5e9"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgAnchor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bgAnchor)"/>

  <!-- Anchor design -->
  <!-- Ring at top -->
  <circle cx="64" cy="35" r="6" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Vertical shaft -->
  <rect x="62" y="41" width="4" height="50" fill="#ffffff"/>

  <!-- Cross bar -->
  <rect x="48" y="65" width="32" height="4" fill="#ffffff" rx="2"/>

  <!-- Bottom flukes (left) -->
  <path d="M64 91 L48 91 Q42 91 42 97 L42 102"
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Bottom flukes (right) -->
  <path d="M64 91 L80 91 Q86 91 86 97 L86 102"
        fill="none"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Decorative waves -->
  <path d="M20 110 Q35 106 50 110 T80 110 T110 110"
        stroke="#ffffff"
        stroke-width="2.5"
        fill="none"
        opacity="0.4"
        stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgWaves" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bgWaves)"/>

  <!-- Abstract wave layers -->
  <!-- Top wave -->
  <path d="M0 45 Q32 35 64 45 T128 45 L128 50 Q96 60 64 50 T0 50 Z"
        fill="#ffffff"
        opacity="0.3"/>

  <!-- Middle wave -->
  <path d="M0 60 Q32 50 64 60 T128 60 L128 68 Q96 78 64 68 T0 68 Z"
        fill="#ffffff"
        opacity="0.5"/>

  <!-- Bottom wave -->
  <path d="M0 78 Q32 68 64 78 T128 78 L128 88 Q96 98 64 88 T0 88 Z"
        fill="#ffffff"
        opacity="0.7"/>

  <!-- Simple yacht silhouette on waves -->
  <path d="M64 25 L64 65 L85 58 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M52 65 L64 70 L76 65 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Mast -->
  <rect x="62" y="20" width="4" height="45" fill="#ffffff"/>

  <!-- Small flag -->
  <path d="M64 20 L75 24 L64 28 Z" fill="#ef4444"/>
</svg>

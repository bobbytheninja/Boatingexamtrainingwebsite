<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgMinimal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bgMinimal)"/>

  <!-- Minimalist yacht - single geometric sail -->
  <path d="M64 30 L64 90 L100 80 Z"
        fill="#ffffff"
        stroke="#ffffff"
        stroke-width="2"
        opacity="0.95"/>

  <!-- Simple hull -->
  <path d="M45 90 L64 98 L83 90 L80 95 L48 95 Z"
        fill="#ffffff"
        opacity="0.9"/>

  <!-- Single wave accent -->
  <path d="M20 100 Q40 96 60 100 T100 100"
        stroke="#ffffff"
        stroke-width="3"
        fill="none"
        opacity="0.4"
        stroke-linecap="round"/>
</svg>

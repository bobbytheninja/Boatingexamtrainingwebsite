<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgCompass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075985;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="compassGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bgCompass)"/>

  <!-- Compass circle -->
  <circle cx="64" cy="64" r="40" fill="url(#compassGlow)" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

  <!-- Compass rose points (N, E, S, W) -->
  <!-- North (red) -->
  <path d="M64 28 L68 60 L64 64 L60 60 Z" fill="#ef4444"/>

  <!-- East -->
  <path d="M100 64 L68 68 L64 64 L68 60 Z" fill="#ffffff" opacity="0.9"/>

  <!-- South -->
  <path d="M64 100 L60 68 L64 64 L68 68 Z" fill="#ffffff" opacity="0.9"/>

  <!-- West -->
  <path d="M28 64 L60 60 L64 64 L60 68 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="64" cy="64" r="5" fill="#ffffff"/>

  <!-- Small cardinal marks -->
  <circle cx="64" cy="32" r="2" fill="#ffffff"/>
  <circle cx="96" cy="64" r="2" fill="#ffffff"/>
  <circle cx="64" cy="96" r="2" fill="#ffffff"/>
  <circle cx="32" cy="64" r="2" fill="#ffffff"/>
</svg>

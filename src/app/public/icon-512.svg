<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg512)"/>

  <!-- Large yacht for 512x512 (Google Search, etc.) -->
  <!-- Hull -->
  <path d="M140 350 L256 400 L372 350 L352 375 L160 375 Z"
        fill="#ffffff" stroke="#0c4a6e" stroke-width="6"/>

  <!-- Main sail -->
  <path d="M256 140 L256 350 L390 300 Z"
        fill="#ffffff" stroke="#0c4a6e" stroke-width="7"/>

  <!-- Front sail -->
  <path d="M256 160 L256 350 L150 290 Z"
        fill="#f0f9ff" stroke="#0c4a6e" stroke-width="7"/>

  <!-- Mast -->
  <rect x="250" y="125" width="12" height="225" fill="#0c4a6e"/>

  <!-- Flag -->
  <path d="M256 125 L300 142 L256 160 Z" fill="#ef4444"/>

  <!-- Waves (multiple layers for depth) -->
  <path d="M40 390 Q100 375 160 390 T280 390 T400 390 T472 390"
        stroke="#ffffff" stroke-width="10" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M40 410 Q100 400 160 410 T280 410 T400 410 T472 410"
        stroke="#ffffff" stroke-width="8" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M40 425 Q100 418 160 425 T280 425 T400 425 T472 425"
        stroke="#ffffff" stroke-width="6" fill="none" opacity="0.25" stroke-linecap="round"/>
</svg>

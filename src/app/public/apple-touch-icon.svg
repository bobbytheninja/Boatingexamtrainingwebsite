<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners (iOS style) -->
  <rect x="0" y="0" width="180" height="180" rx="40" fill="url(#bgGrad)"/>

  <!-- Large, bold yacht for Apple devices -->
  <!-- Hull -->
  <path d="M50 120 L90 140 L130 120 L122 130 L58 130 Z" fill="#ffffff" stroke="#0c4a6e" stroke-width="2"/>

  <!-- Main sail -->
  <path d="M90 50 L90 120 L135 105 Z" fill="#ffffff" stroke="#0c4a6e" stroke-width="2.5"/>

  <!-- Front sail -->
  <path d="M90 58 L90 120 L55 100 Z" fill="#f0f9ff" stroke="#0c4a6e" stroke-width="2.5"/>

  <!-- Mast -->
  <rect x="87" y="42" width="6" height="78" fill="#0c4a6e"/>

  <!-- Flag -->
  <path d="M90 42 L107 49 L90 56 Z" fill="#ef4444"/>

  <!-- Waves -->
  <path d="M15 135 Q35 128 55 135 T95 135 T135 135 T165 135"
        stroke="#ffffff" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M15 145 Q35 140 55 145 T95 145 T135 145 T165 145"
        stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Rounded square matching navbar logo (rounded-2xl = ~16px radius) -->
  <rect width="64" height="64" rx="16" ry="16" fill="url(#bg)"/>
  <!-- Anchor rotated -12deg around center, matching navbar icon -->
  <g transform="rotate(-12 32 32)">
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="13" r="5"/>
      <line x1="32" y1="18" x2="32" y2="50"/>
      <line x1="22" y1="24" x2="42" y2="24"/>
      <path d="M 10 38 Q 14 54 32 54 Q 50 54 54 38"/>
    </g>
    <g fill="#ffffff">
      <path d="M 10 38 L 6 34 L 14 33 Z"/>
      <path d="M 54 38 L 58 34 L 50 33 Z"/>
    </g>
  </g>
  <!-- Yellow dot top-right, matching the w-2 h-2 absolute dot in the navbar -->
  <circle cx="53" cy="11" r="5" fill="#fde047"/>
</svg>

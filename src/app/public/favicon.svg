<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background (better for favicons) -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="url(#bgGradient)"/>

  <!-- White yacht silhouette (bold and simple for small sizes) -->
  <!-- Hull -->
  <path d="M35 85 L64 100 L93 85 L88 92 L40 92 Z" fill="#ffffff"/>

  <!-- Main sail (larger and bolder) -->
  <path d="M64 35 L64 85 L95 75 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Front sail -->
  <path d="M64 40 L64 85 L40 70 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Mast (thicker) -->
  <rect x="62" y="30" width="4" height="55" fill="#0c4a6e"/>

  <!-- Flag -->
  <path d="M64 30 L76 35 L64 40 Z" fill="#ef4444"/>

  <!-- Simple wave at bottom -->
  <path d="M10 95 Q25 90 40 95 T70 95 T100 95 T118 95"
        stroke="#ffffff" stroke-width="3" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>
